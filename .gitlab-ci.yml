workflow:
  rules:
    - if: $CI_COMMIT_BRANCH


stages:
  - build
  - test

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR\\.gradle"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .gradle/wrapper/
    - .gradle/caches/

before_script:
  - java -version
  - .\gradlew.bat --version

build:
  stage: build
  script:
    - .\gradlew.bat clean assemble
  artifacts:
    paths:
      - build/libs/
    expire_in: 1 week

test:
  stage: test
  script:
    - .\gradlew.bat test
  artifacts:
    when: always
    reports:
      junit:
        - build/test-results/test/*.xml

