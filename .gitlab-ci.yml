# .gitlab-ci.yml
image: openjdk:24-jdk-slim

stages:
  - build
  - test
  - package

before_script:
  - apt-get update && apt-get install -y findutils
  - java -version
  - ./gradlew --version
  - ./gradlew clean

# Build stage
build:
  stage: build
  script:
    - ./gradlew clean assemble --no-daemon
  artifacts:
    paths:
      - build/libs/
    expire_in: 1 week

# Test stage
test:
  stage: test
  script:
    - ./gradlew test --no-daemon
  artifacts:
    reports:
      junit:
        - build/test-results/test/*.xml
  allow_failure: true

# Package stage
pacakge_prod:
  stage: package
  script:
    - export COMMIT_HASH="$CI_COMMIT_SHORT_SHA"
    - export DEPLOYMENT_TYPE="latest"
    - export DOCKER_USERNAME="$DOCKER_USERNAME"
    - export DOCKER_PASSWORD="$DOCKER_PASSWORD"
    - ./gradlew bootBuildImage --no-daemon
  only:
    - main

package_staging:
  stage: package
  services:
    - name: docker:dind
      command: ["--tls=false"]
  script:
    - docker info
    - export COMMIT_HASH="$CI_COMMIT_SHORT_SHA"
    - export DEPLOYMENT_TYPE="staging"
    - export DOCKER_USERNAME="$DOCKER_USERNAME"
    - export DOCKER_PASSWORD="$DOCKER_PASSWORD"
    - env
    - ./gradlew bootBuildImage --no-daemon
  only:
    - staging
