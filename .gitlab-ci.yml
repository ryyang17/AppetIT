image: openjdk:21-jdk

variables:
  POSTGRES_DB: appetit
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: password
  POSTGRES_HOST_AUTH_METHOD: trust

services:
  - postgres:17

stages:
  - build
  - test

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches

before_script:
  - chmod +x gradlew
  - export GRADLE_USER_HOME=`pwd`/.gradle

build:
  stage: build
  script:
    - ./gradlew assemble
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 week

test:
  stage: test
  script:
    - ./gradlew test
  artifacts:
    when: always
    reports:
      junit:
        - build/test-results/test/**/TEST-*.xml

lint:
  stage: test
  script:
    - ./gradlew ktlintCheck
  allow_failure: true
