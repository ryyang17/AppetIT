build:
  stage: build
  tags:
    - api
  script:
    - ./gradlew assemble
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 week

test:
  stage: test
  tags:
    - api
  script:
    - ./gradlew test
  artifacts:
    when: always
    reports:
      junit:
        - build/test-results/test/**/TEST-*.xml

lint:
  stage: test
  tags:
    - api
  script:
    - ./gradlew k
