version: '3.9'

services:
  staging:
    image: 547988/appetit-api:staging
    container_name: appetit-staging
    environment:
      - SPRING_PROFILES_ACTIVE=staging
      - DB_PASSWORD=${STAGING_DB_PASSWORD}
    ports:
      - "8081:8080"
    restart: always

  prod:
    image: 547988/appetit-api:latest
    container_name: appetit-prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_PASSWORD=${PROD_DB_PASSWORD}
    ports:
      - "8082:8080"
    restart: always

